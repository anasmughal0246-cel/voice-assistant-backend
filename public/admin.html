<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Anas AI</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0b0c10;
    color: #ecedf1;
    min-height: 100vh;
  }
  #loginBox {
    max-width: 360px;
    margin: 100px auto;
    padding: 30px;
    background: #14161d;
    border: 1px solid #262933;
    border-radius: 16px;
  }
  #loginBox h2 { margin-top: 0; }
  #loginBox input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    background: #1c1f28;
    border: 1px solid #262933;
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
  }
  #loginBox button, .action-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #b366ff, #ff5fa8);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  #errorMsg { color: #ff5f5f; font-size: 13px; margin-top: 8px; }
  #dashboard { display: none; padding: 24px; max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th, td { text-align: left; padding: 10px; border-bottom: 1px solid #262933; font-size: 13.5px; }
  th { color: #8b8d98; font-weight: 500; }
  tr:hover { background: #14161d; cursor: pointer; }
  .badge { background: #b366ff; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
  #historyBox { display: none; margin-top: 20px; padding: 16px; background: #14161d; border-radius: 12px; border: 1px solid #262933; }
  .msg { padding: 8px 12px; margin: 6px 0; border-radius: 8px; font-size: 13.5px; }
  .msg.user { background: #6c5cff33; text-align: right; }
  .msg.assistant { background: #1c1f28; }
  #backBtn { background: #1c1f28; margin-bottom: 10px; width: auto; padding: 8px 14px; font-size: 13px; }
</style>
</head>
<body>

<div id="loginBox">
  <h2>Admin Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <div id="errorMsg"></div>
</div>

<div id="dashboard">
  <h1>👥 Users</h1>
  <table>
    <thead>
      <tr><th>Name</th><th>Email</th><th>Joined</th><th>Role</th></tr>
    </thead>
    <tbody id="usersTable"></tbody>
  </table>

  <div id="historyBox">
    <button id="backBtn" onclick="closeHistory()">← Back</button>
    <h3 id="historyTitle"></h3>
    <div id="historyMessages"></div>
  </div>
</div>

<script>
const API = window.location.origin + '/api';
let token = localStorage.getItem('adminToken');

if (token) showDashboard();

async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.textContent = '';

  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) { errorMsg.textContent = data.error || 'Login failed'; return; }

    token = data.token;
    localStorage.setItem('adminToken', token);
    showDashboard();
  } catch (err) {
    errorMsg.textContent = 'Network error';
  }
}

async function showDashboard() {
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';

  try {
    const res = await fetch(`${API}/admin/users`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    const data = await res.json();

    if (!res.ok) {
      alert(data.error || 'Access denied. Are you an admin?');
      localStorage.removeItem('adminToken');
      location.reload();
      return;
    }

    const tbody = document.getElementById('usersTable');
    tbody.innerHTML = '';
    data.users.forEach(u => {
      const tr = document.createElement('tr');
      tr.onclick = () => viewHistory(u._id, u.name);
      tr.innerHTML = `
        <td>${u.name}</td>
        <td>${u.email}</td>
        <td>${new Date(u.createdAt).toLocaleDateString()}</td>
        <td>${u.isAdmin ? '<span class="badge">Admin</span>' : 'User'}</td>
      `;
      tbody.appendChild(tr);
    });
  } catch (err) {
    alert('Failed to load users');
  }
}

async function viewHistory(userId, name) {
  const res = await fetch(`${API}/admin/conversations/${userId}`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  const data = await res.json();

  document.getElementById('historyTitle').textContent = `Chat history — ${name}`;
  const container = document.getElementById('historyMessages');
  container.innerHTML = '';
  if (!data.messages || data.messages.length === 0) {
    container.innerHTML = '<p style="color:#8b8d98">No messages yet.</p>';
  } else {
    data.messages.forEach(m => {
      const div = document.createElement('div');
      div.className = 'msg ' + m.role;
      div.textContent = m.text;
      container.appendChild(div);
    });
  }
  document.getElementById('historyBox').style.display = 'block';
  document.getElementById('historyBox').scrollIntoView({ behavior: 'smooth' });
}

function closeHistory() {
  document.getElementById('historyBox').style.display = 'none';
}
</script>
</body>
</html>
